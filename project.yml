name: Orio
options:
  bundleIdPrefix: com.orio
  deploymentTarget:
    watchOS: 10.0
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Orio:
    type: application
    platform: watchOS
    sources:
      - Sources
      - Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.orio.Orio
      INFOPLIST_FILE: Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      CODE_SIGN_ENTITLEMENTS: Resources/Orio.entitlements
      SUPPORTED_PLATFORMS: "watchos watchsimulator"
      TARGETED_DEVICE_FAMILY: 4
      SKIP_INSTALL: NO
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 97R97H732K
      PROVISIONING_PROFILE_SPECIFIER: ""
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Orio
        WKApplication: true
        WKWatchOnly: true
        NSLocationWhenInUseUsageDescription: "Orio needs your location to alert you before reaching your destination."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Orio tracks your position during naps to notify you near your stop."
        UIBackgroundModes:
          - location
        WKBackgroundModes:
          - alarm
    entitlements:
      path: Resources/Orio.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true

schemes:
  Orio:
    build:
      targets:
        Orio: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
